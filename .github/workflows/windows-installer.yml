name: Installateur Windows
# La suite applicative couvre aussi PostgreSQL 18 dans tests.yml.
on:
  workflow_dispatch:
  push:
    branches: [main, codex/consolidation-installateur-migration, Claude-Avant-Servisa, Claude-Reprise-Documents, Claude-HTTPS-IP]
    paths: ['desktop/**', 'app/**', 'migrations/**', 'config.py', 'requirements.txt', '.github/workflows/windows-installer.yml']
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'app/**', 'migrations/**', 'config.py', 'requirements.txt', '.github/workflows/windows-installer.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Pebble : serveur ACME de test de Let's Encrypt (recette du certificat reconnu).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Préparer les outils de construction
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile "$env:RUNNER_TEMP/inno.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP/inno.exe").Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Empreinte Inno Setup invalide' }
          $setup = Start-Process "$env:RUNNER_TEMP/inno.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$env:RUNNER_TEMP/inno" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installation du compilateur impossible' }
      - name: Compiler le paquet autonome
        shell: pwsh
        run: python desktop/build.py --work "$env:RUNNER_TEMP/build-mcs" --output outputs --iscc "$env:RUNNER_TEMP/inno/ISCC.exe"
      - name: Installer et vérifier le service sur Windows Server
        shell: pwsh
        run: |
          if (Test-Path "$env:ProgramData/MonCentreSocial") { throw 'Une instance existe déjà' }
          $installer = (Resolve-Path 'outputs/Mon-Centre-Social-1.0.0-rc2-Setup-x64.exe').Path
          $installation = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -notin 0,3010) { throw "Installation : $($installation.ExitCode)" }
          $appDir = Join-Path $env:ProgramFiles 'Mon Centre Social'
          $nativeSource = (Resolve-Path 'desktop\MonCentreSocial.cs').Path
          $testSource = (Resolve-Path 'desktop\SystemSmoke.cs').Path
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:exe /platform:x64 /main:MonCentreSocial.SystemSmoke "/out:$appDir\RecetteSysteme.exe" /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.ServiceProcess.dll /r:System.Web.Extensions.dll /r:System.Security.dll $nativeSource $testSource
          if ($LASTEXITCODE -ne 0) { throw 'Compilation de la recette impossible' }
          & "$appDir/RecetteSysteme.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Recette service échouée' }
          # Registres hors base : verrou et écriture atomique entre processus, avec le Python livré.
          & "$appDir/python/python.exe" -B (Resolve-Path 'desktop/recette_registres.py').Path $appDir
          if ($LASTEXITCODE -ne 0) { throw 'Recette des registres échouée' }
          # Certificat reconnu (nom public) : Pebble, DNS de test et faux cPanel.
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1 github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          if ($LASTEXITCODE -ne 0) { throw 'Installation de Pebble impossible' }
          $env:PEBBLE_BIN_DIR = Join-Path (go env GOPATH) 'bin'
          $bench = Join-Path $env:RUNNER_TEMP 'banc-certificat'
          $benchProcess = Start-Process "$appDir/python/python.exe" -ArgumentList '-B', (Resolve-Path 'desktop/recette_certificat.py').Path, $bench -WindowStyle Hidden -PassThru -RedirectStandardError "$env:RUNNER_TEMP/banc-certificat.err"
          for ($i = 0; !(Test-Path "$bench/banc.json"); $i++) { if ($i -ge 120 -or $benchProcess.HasExited) { Get-Content "$env:RUNNER_TEMP/banc-certificat.err" -ErrorAction SilentlyContinue; throw 'Banc du certificat non démarré' }; Start-Sleep -Milliseconds 500 }
          & "$appDir/RecetteSysteme.exe" certificat "$bench/banc.json"
          $certificatCode = $LASTEXITCODE
          New-Item "$bench/stop" -ItemType File | Out-Null
          $benchProcess.WaitForExit(30000) | Out-Null
          if ($certificatCode -ne 0) { Get-Content "$bench/pebble.log" -Tail 40 -ErrorAction SilentlyContinue; throw 'Recette du certificat reconnu échouée' }
          # Reproduit la version réelle de la source, distincte du moteur 18.6 livré.
          $pgFixture = Join-Path $env:RUNNER_TEMP 'postgresql-18.1-fixture'
          $pgZip = Join-Path $env:RUNNER_TEMP 'postgresql-18.1.zip'
          Invoke-WebRequest 'https://get.enterprisedb.com/postgresql/postgresql-18.1-1-windows-x64-binaries.zip' -OutFile $pgZip
          if ((Get-FileHash $pgZip).Hash -ne 'B2A7302ECB78088209EDD96A936EC360FC12C58EC27DC8CC4E8CE5AEFB9F8D3B') { throw 'Empreinte PostgreSQL 18.1 invalide' }
          Expand-Archive $pgZip $pgFixture
          $env:MCS_TEST_POSTGRES_BIN = Join-Path $pgFixture 'pgsql/bin'
          & "$appDir/RecetteSysteme.exe" migration (Resolve-Path 'desktop/migration_smoke.py').Path
          if ($LASTEXITCODE -ne 0) { throw 'Reprise de la base ancienne échouée' }
          $update = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($update.ExitCode -notin 0,3010) { throw 'Mise à jour échouée' }
          & "$appDir/RecetteSysteme.exe" resume
          if ($LASTEXITCODE -ne 0) { throw 'Reprise après mise à jour échouée' }
          $uninstall = Start-Process "$appDir/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Désinstallation échouée' }
          if (Get-Service MonCentreSocial -ErrorAction SilentlyContinue) { throw 'Le service subsiste après désinstallation' }
          if (Get-Service MonCentreSocialHTTPS -ErrorAction SilentlyContinue) { throw 'Le service HTTPS subsiste après désinstallation' }
          if (Test-Path "$appDir/MonCentreSocial.exe") { throw 'Le programme subsiste après désinstallation' }
          if (!(Test-Path "$env:ProgramData/MonCentreSocial/Direction-DSI/Installation-confidentielle.txt")) { throw 'Le dossier confidentiel a été perdu' }
          if (!(Test-Path "$env:ProgramData/MonCentreSocial/postgresql/PG_VERSION")) { throw 'La base a été perdue' }
          'Installation, service, HTTPS, certificat reconnu, DPAPI, ACL, reprise PostgreSQL ancienne avec comptes et documents, source intacte, arrêt, redémarrage, mise à jour et désinstallation : OK.' | Set-Content outputs/recette-systeme.txt
      - name: Diagnostic protégé en cas d'échec
        if: failure()
        shell: pwsh
        run: |
          Get-Content "$env:ProgramData/MonCentreSocial/logs/service.log" -Tail 35 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: Mon-Centre-Social-Windows-x64
          path: outputs/*
          retention-days: 30
