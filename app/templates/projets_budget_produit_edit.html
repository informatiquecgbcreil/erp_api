{% extends "layout.html" %}
{% block title %}Modifier un financeur — {{ produit.financeur }}{% endblock %}
{% block body %}
<div class="stack">
  <div class="card">
    {% include "_projet_budget_header.html" %}
    <div class="spacer"></div>
    <a class="btn" href="{{ url_for('projets.projet_budget_produits', projet_id=projet.id) }}">↩ Retour produits</a>
    <div class="spacer"></div>
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="produit-financeur">Financeur</label>
      <input name="financeur" id="produit-financeur" value="{{ produit.financeur }}" required>

      <div class="row three">
        <div class="stack">
          <label for="produit-categorie">Catégorie</label>
          <input name="categorie" id="produit-categorie" value="{{ produit.categorie }}">
        </div>
        <div class="stack">
          <label for="produit-statut">Statut</label>
          <input name="statut" id="produit-statut" value="{{ produit.statut }}">
        </div>
        <div class="stack">
          <label for="produit-montant-demande">Demandé (€)</label>
          <input name="montant_demande" id="produit-montant-demande" type="number" step="0.01" value="{{ produit.montant_demande or 0 }}">
        </div>
        <div class="stack">
          <label for="produit-montant-accorde">Accordé (€)</label>
          <input name="montant_accorde" id="produit-montant-accorde" type="number" step="0.01" value="{{ produit.montant_accorde or 0 }}">
        </div>
        <div class="stack">
          <label for="produit-montant-recu">Reçu (€)</label>
          <input name="montant_recu" id="produit-montant-recu" type="number" step="0.01" value="{{ produit.montant_recu or 0 }}">
        </div>
      </div>

      <label for="produit-reference-dossier">Référence dossier</label>
      <input name="reference_dossier" id="produit-reference-dossier" value="{{ produit.reference_dossier or '' }}">

      <label for="produit-commentaire">Commentaire</label>
      <input name="commentaire" id="produit-commentaire" value="{{ produit.commentaire or '' }}">

      <div class="row three">
        <button class="btn ok" type="submit">Enregistrer</button>
        <a class="btn" href="{{ url_for('projets.projet_budget_produits', projet_id=projet.id) }}">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
