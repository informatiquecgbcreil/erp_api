{% extends "layout.html" %}
{% block title %}Nouveau mot de passe{% endblock %}
{% block body %}
<div class="card" style="max-width:640px; margin:0 auto;">
  <h1>Nouveau mot de passe</h1>
  <p>Définissez un nouveau mot de passe (minimum 12 caractères).</p>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row">
      <div>
        <label for="resetPassword">Nouveau mot de passe</label>
        <input name="password" id="resetPassword" type="password" minlength="12" required autocomplete="new-password">
      </div>
      <div>
        <label for="resetPasswordConfirm">Confirmation du mot de passe</label>
        <input name="password_confirm" id="resetPasswordConfirm" type="password" minlength="12" required autocomplete="new-password">
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn ok" type="submit">Mettre à jour le mot de passe</button>
  </form>
</div>
{% endblock %}
