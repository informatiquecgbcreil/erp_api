{# Définir ou changer la phrase secrète des copies cloud (admin_sauvegardes.html).
   Attend « libelle_bouton ». La phrase n'est jamais enregistrée : seules des
   clés qu'elle protège le sont (app/services/chiffrement_sauvegarde.py). #}
<form method="post" action="{{ url_for('admin.sauvegarde_phrase') }}" class="stack" style="gap:8px;max-width:520px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Phrase secrète (au moins 16 caractères)
    <input class="in" type="password" name="phrase" minlength="16" autocomplete="new-password" required></label>
  <label>La même, une seconde fois
    <input class="in" type="password" name="confirmation" minlength="16" autocomplete="new-password" required></label>
  <label><input type="checkbox" name="notee" value="1" required>
    J'ai noté cette phrase hors du serveur : sans elle, personne ne pourra rouvrir les copies cloud.</label>
  <div><button class="btn primary" type="submit">{{ libelle_bouton }}</button></div>
</form>
